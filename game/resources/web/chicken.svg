<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="head" cx="50%" cy="58%" r="55%">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset=".75" stop-color="#f7ecd2"/>
      <stop offset="1" stop-color="#e8d3a6"/>
    </radialGradient>
    <linearGradient id="comb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0453a"/>
      <stop offset="1" stop-color="#c01f1f"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc23d"/>
      <stop offset="1" stop-color="#f08a12"/>
    </linearGradient>
  </defs>
  <!-- comb -->
  <g fill="url(#comb)" stroke="#5a1408" stroke-width="4" stroke-linejoin="round">
    <circle cx="44" cy="30" r="12"/>
    <circle cx="64" cy="20" r="14"/>
    <circle cx="84" cy="30" r="12"/>
  </g>
  <!-- head -->
  <ellipse cx="64" cy="70" rx="46" ry="44" fill="url(#head)" stroke="#6b4a1c" stroke-width="5"/>
  <ellipse cx="64" cy="54" rx="26" ry="10" fill="#fff" opacity=".6"/>
  <!-- eyes -->
  <ellipse cx="46" cy="62" rx="6" ry="8" fill="#111"/>
  <ellipse cx="82" cy="62" rx="6" ry="8" fill="#111"/>
  <!-- wattle -->
  <path d="M58 92 Q56 108 64 110 Q72 108 70 92 Z" fill="url(#comb)" stroke="#5a1408" stroke-width="3" stroke-linejoin="round"/>
  <!-- beak -->
  <path d="M50 76 L78 76 L64 96 Z" fill="url(#beak)" stroke="#7a3e05" stroke-width="3.5" stroke-linejoin="round"/>
