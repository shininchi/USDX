<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1020">
  <title>UltraStar - Cancionero</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/assets/icon-512.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cancionero">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div class="brand" id="brand"><img class="brand-logo" id="brandLogo" src="/assets/logo-128.png" alt=""><span data-i18n="brand">Cancionero</span></div>
      <button class="chip" id="autoplayChip" aria-pressed="false"></button>
      <span class="crown-badge hidden" id="crownBadge"></span>
      <button class="chip mic-chip" id="micChip" title="Micrófono" aria-label="Micrófono"><span class="mic-box"></span></button>
      <button class="chip" id="nickChip" title="Cambiar apodo">…</button>
    </div>
    <nav class="tabs">
      <button id="tabSongs" class="active" data-i18n="tab_songs">Canciones</button>
      <button id="tabRecords" data-i18n="tab_records">Logros</button>
      <button id="tabQueue"><span data-i18n="tab_inqueue">En cola</span><span class="badge hidden" id="queueBadge">0</span></button>
    </nav>
    <div class="now hidden" id="nowPlaying"></div>
  </header>

  <main>
    <section id="songsView">
      <input type="search" id="search" autocomplete="off" data-i18n-placeholder="search_placeholder" placeholder="Buscar artista o canción…">
      <div class="toolbar">
        <button class="btn-ghost" id="filtersBtn"><span data-i18n="filters">Filtros</span><span class="badge hidden" id="filtersBadge">0</span></button>
        <select id="sort" aria-label="Orden">
          <option value="artist" data-i18n="sort_artist">Artista A–Z</option>
          <option value="title" data-i18n="sort_title">Título A–Z</option>
          <option value="popular" data-i18n="sort_popular">Más cantadas</option>
          <option value="requested" data-i18n="sort_requested">Más pedidas</option>
          <option value="score" data-i18n="sort_score">Mejor puntuación</option>
          <option value="year" data-i18n="sort_year">Más recientes</option>
        </select>
        <div class="view-toggle" role="group" aria-label="Vista">
          <button data-view="grid" title="Cuadrícula">▦</button>
          <button data-view="list" title="Lista">☰</button>
          <button data-view="text" title="Solo texto">≡</button>
        </div>
      </div>

      <div class="filters hidden" id="filters">
        <label><span data-i18n="f_language">Idioma</span><select id="fLanguage"></select></label>
        <label><span data-i18n="f_genre">Género</span><select id="fGenre"></select></label>
        <label><span data-i18n="f_decade">Década</span><select id="fDecade"></select></label>
        <label><span data-i18n="f_folder">Carpeta</span><select id="fFolder"></select></label>
        <label><span data-i18n="f_duet">Dúo</span>
          <select id="fDuet">
            <option value="-1" data-i18n="any">Cualquiera</option>
            <option value="1" data-i18n="yes">Sí</option>
            <option value="0" data-i18n="no">No</option>
          </select>
        </label>
        <label><span data-i18n="f_video">Vídeo</span>
          <select id="fVideo">
            <option value="-1" data-i18n="any">Cualquiera</option>
            <option value="1" data-i18n="with_video">Con vídeo</option>
            <option value="0" data-i18n="without_video">Sin vídeo</option>
          </select>
        </label>
        <div class="actions"><button class="btn-ghost" id="resetFilters" data-i18n="reset">Quitar filtros</button></div>
      </div>

      <div class="summary" id="summary"></div>
      <div class="results grid" id="results"></div>
    </section>

    <section id="recordsView" class="hidden">
      <div id="records"></div>
    </section>

    <section id="queueView" class="hidden">
      <div class="notice hidden" id="pausedNotice" data-i18n="paused_notice">Las peticiones están cerradas ahora mismo.</div>
      <div class="queue" id="queue"></div>
      <p class="summary" style="text-align:center;margin-top:24px"><a href="#" id="tourLink" style="color:inherit" data-i18n="tour_replay">Ver la guía</a> · <a href="/admin" style="color:inherit">Admin</a></p>
    </section>
  </main>

  <nav class="az-index hidden" id="azIndex" aria-label="A-Z"></nav>
  <div class="az-bubble hidden" id="azBubble"></div>
  <button class="to-top hidden" id="toTop" aria-label="Arriba">↑</button>

  <script src="/assets/common.js"></script>
  <script src="/assets/tour.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
