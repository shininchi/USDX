<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1020">
  <meta name="robots" content="noindex">
  <title>UltraStar · Admin</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div class="brand">🛠️ <span data-i18n="admin_title">Admin · Peticiones</span></div>
    </div>
    <nav class="tabs hidden" id="tabs">
      <button data-tab="queue" class="active"><span data-i18n="tab_queue">Cola</span><span class="badge hidden" id="queueBadge">0</span></button>
      <button data-tab="users"><span data-i18n="tab_users">Usuarios</span><span class="badge hidden" id="usersBadge">0</span></button>
      <button data-tab="settings" data-i18n="tab_settings">Ajustes</button>
    </nav>
  </header>

  <main>
    <section id="login" class="hidden">
      <form class="form" id="loginForm" style="max-width: 360px; margin: 40px auto;">
        <label for="pin" data-i18n="admin_pin">PIN de administración</label>
        <input type="password" id="pin" inputmode="numeric" autocomplete="current-password">
        <button class="btn-primary" type="submit" data-i18n="login">Entrar</button>
      </form>
    </section>

    <section id="queueTab" class="hidden">
      <div class="toolbar">
        <label class="switch" style="flex: 1"><input type="checkbox" id="pausedQuick"><span data-i18n="s_paused">Peticiones cerradas</span></label>
        <button class="btn-danger" id="clearQueue" data-i18n="clear_queue">Vaciar cola</button>
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr><th>#</th><th data-i18n="song">Canción</th><th data-i18n="votes_col">Votos</th><th></th></tr></thead>
          <tbody id="queueRows"></tbody>
        </table>
      </div>
    </section>

    <section id="usersTab" class="hidden">
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr><th data-i18n="nick">Apodo</th><th data-i18n="requests_col">Peticiones</th><th data-i18n="status">Estado</th><th></th></tr></thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
    </section>

    <section id="settingsTab" class="hidden">
      <form class="settings-grid" id="settingsForm">
        <label class="switch"><input type="checkbox" id="sPaused"><span data-i18n="s_paused">Peticiones cerradas</span></label>
        <label><span data-i18n="s_max_pending"></span><input type="number" id="sMaxPending" min="0" max="100"></label>
        <label><span data-i18n="s_cooldown"></span><input type="number" id="sCooldown" min="0" max="3600"></label>
        <label><span data-i18n="s_recent"></span><input type="number" id="sRecent" min="0" max="1440"></label>
        <button class="btn-primary" type="submit" data-i18n="save">Guardar</button>
      </form>
    </section>
  </main>

  <script src="/assets/common.js"></script>
  <script src="/assets/admin.js"></script>
</body>
</html>
